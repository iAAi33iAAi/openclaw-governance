name: Governance Flow Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the governance flow
        run: python -m py_compile backend/openclaw_flow.py
      - name: Run governance flow regression tests
        run: python -m unittest discover -s tests -v
